
name: Simple ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Train ML model
        run: python train.py

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t simple-ml:1.0 .
